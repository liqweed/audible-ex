# Releases a version: a `vX.Y.Z` tag on a commit of main builds the extension, signs it with the
# Chrome Web Store key and submits it for review (DECISIONS.md D20; the one-time setup is in
# docs/STORE-LISTING.md, "Automated releases"). Each secret lives in the one job that needs it:
#   build   - no secrets; makes the zips and the unsigned build
#   sign    - the signing key (environment release-signing); no store access
#   publish - Google identity through OIDC (environment chrome-web-store); no key, no package installs
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# A release is never cancelled half way, and each tag has its own group so that a queued tag is
# not dropped for a newer one. upload-cws.ts refuses to upload while a submission is in review.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 'Build — check, zip'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, to tell whether the tag is on main.
          fetch-depth: 0

      - name: The tag matches package.json and is on main
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main"
            exit 1
          fi

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - run: bun install --frozen-lockfile

      # The same gate as CI: biome ci → effect-tsgo tsc --noEmit → bun test
      - run: bun check

      # `wxt zip` builds first, so .output/chrome-mv3 is exactly what the Chrome zip holds.
      - run: bun zip

      - run: bun scripts/check-content-size.ts

      - run: bun zip:firefox

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: .output/chrome-mv3
          if-no-files-found: error
          retention-days: 30

      # upload-artifact skips hidden directories such as .output when the path is a glob.
      - run: mkdir release-zips && cp .output/*.zip release-zips/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zips
          path: release-zips/*.zip
          if-no-files-found: error
          retention-days: 30

  sign:
    name: Sign — Chrome Web Store key
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds CWS_SIGNING_KEY; the environment allows only `v*` tags.
    environment: release-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      # All installs come before the key exists on the runner.
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
          path: .output/chrome-mv3

      # pack-crx.ts checks the key against .config/cws-signing-key.pub.pem and the CRX's signature
      # after packing, so a wrong key fails here and not in the store.
      - name: Pack and sign the CRX
        env:
          CWS_SIGNING_KEY: ${{ secrets.CWS_SIGNING_KEY }}
        run: |
          if [ -z "$CWS_SIGNING_KEY" ]; then
            echo "::error::The CWS_SIGNING_KEY secret of the release-signing environment is empty"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/cws-signing-key.pem"
          printf '%s\n' "$CWS_SIGNING_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          bun crx --key "$key"

      - run: mkdir release-crx && cp .output/*.crx release-crx/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-crx
          path: release-crx/*.crx
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish — Chrome Web Store
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reviewers and the `v*` tag rule are set on this environment (docs/STORE-LISTING.md).
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-crx
          path: .output

      # Google trusts this repository's OIDC token for the `chrome-web-store` environment and hands
      # back a 1-hour access token; no credential is stored in GitHub.
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      # No `bun install`: the script uses only Bun and node:crypto. It refuses a CRX that the
      # committed public key does not verify.
      - name: Upload and submit for review
        env:
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
        run: bun scripts/upload-cws.ts .output/audible-ex-*-chrome.crx

  github-release:
    name: GitHub release — zips
    # After the store accepted the submission, so a failed run leaves no release to clash with a re-run.
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zips
          path: zips

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" zips/*.zip --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
