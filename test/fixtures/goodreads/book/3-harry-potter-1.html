          "name": "J.K. Rowling",
          "description": "See also: \u003ca href=\"https://www.goodreads.com/author/show/383606.Robert_Galbraith\" title=\"Robert Galbraith\" rel=\"nofollow noopener\">Robert Galbraith\u003c/a>\u003cbr />Although she writes under the pen name \u003cb>J.K. Rowling\u003c/b>, pronounced like \u003ci>rolling\u003c/i>, her name when her first \u003ci>Harry Potter\u003c/i> book was published was simply \u003cb>Joanne Rowling\u003c/b>. Anticipating that the target audience of young boys might not want to read a book written by a woman, her publishers demanded that she use two initials, rather than her full name. As she had no middle name, she chose \u003cb>K\u003c/b> as the second initial of her pen name, from her paternal grandmother Kathleen Ada Bulgen Rowling. She calls herself \u003cb>Jo\u003c/b> and has said, \"No one ever called me 'Joanne' when I was young, unless they were angry.\" Following her marriage, she has sometimes used the name \u003cb>Joanne Murray\u003c/b> when conducting personal business. During the Leveson Inquiry she gave evidence under the name of \u003cb>Joanne Kathleen Rowling\u003c/b>. In a 2012 interview, Rowling noted that she no longer cared that people pronounced her name incorrectly.\u003cbr />\u003cbr />Rowling was born to Peter James Rowling, a Rolls-Royce aircraft engineer, and Anne Rowling (née Volant), on 31 July 1965 in Yate, Gloucestershire, England, 10 miles (16 km) northeast of Bristol. Her mother Anne was half-French and half-Scottish. Her parents first met on a train departing from King's Cross Station bound for Arbroath in 1964. They married on 14 March 1965. Her mother's maternal grandfather, Dugald Campbell, was born in Lamlash on the Isle of Arran. Her mother's paternal grandfather, Louis Volant, was awarded the Croix de Guerre for exceptional bravery in defending the village of Courcelles-le-Comte during the First World War.\u003cbr />\u003cbr />Rowling's sister Dianne was born at their home when Rowling was 23 months old. The family moved to the nearby village Winterbourne when Rowling was four. She attended St Michael's Primary School, a school founded by abolitionist William Wilberforce and education reformer Hannah More. Her headmaster at St Michael's, Alfred Dunn, has been suggested as the inspiration for the \u003ci>Harry Potter\u003c/i> headmaster Albus Dumbledore.\u003cbr />\u003cbr />As a child, Rowling often wrote fantasy stories, which she would usually then read to her sister. She recalls that: \"I can still remember me telling her a story in which she fell down a rabbit hole and was fed strawberries by the rabbit family inside it. Certainly the first story I ever wrote down (when I was five or six) was about a rabbit called Rabbit. He got the measles and was visited by his friends, including a giant bee called Miss Bee.\" At the age of nine, Rowling moved to Church Cottage in the Gloucestershire village of Tutshill, close to Chepstow, Wales. When she was a young teenager, her great aunt, who Rowling said \"taught classics and approved of a thirst for knowledge, even of a questionable kind,\" gave her a very old copy of Jessica Mitford's autobiography, \u003ci>Hons and Rebels\u003c/i>. Mitford became Rowling's heroine, and Rowling subsequently read all of her books.\u003cbr />\u003cbr />Rowling has said of her teenage years, in an interview with The New Yorker, \"I wasn’t particularly happy. I think it’s a dreadful time of life.\" She had a difficult homelife; her mother was ill and she had a difficult relationship with her father (she is no longer on speaking terms with him). She attended secondary school at Wyedean School and College, where her mother had worked as a technician in the science department. Rowling said of her adolescence, \"Hermione [a bookish, know-it-all \u003ci>Harry Potter\u003c/i> character] is loosely based on me. She's a caricature of me when I was eleven, which I'm not particularly proud of.\" Steve Eddy, who taught Rowling English when she first arrived, remembers her as \"not exceptional\" but \"one of a group of girls who were bright, and quite good at English.\" Sean Harris, her best friend in the Upper Sixth owned a turquoise Ford Anglia, which she says inspired the one in her books.",
