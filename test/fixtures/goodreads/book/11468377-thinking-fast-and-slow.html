          "name": "Daniel Kahneman",
          "description": "\u003ci>From \u003ca href=\"http://en.wikipedia.org/wiki/Daniel_Kahneman\" rel=\"nofollow noopener\">Wikipedia\u003c/a>:\u003c/i>\u003cbr />\u003cbr />Daniel Kahneman (Hebrew: דניאל כהנמן‎; born 5 March 1934 - died 27 March 2024), was an Israeli-American psychologist and winner of the 2002 Nobel Memorial Prize in Economic Sciences, notable for his work on behavioral finance and hedonic psychology.\u003cbr />\u003cbr />With Amos Tversky and others, Kahneman established a cognitive basis for common human errors using heuristics and biases (Kahneman &amp; Tversky, 1973, Kahneman, Slovic &amp; Tversky, 1982), and developed Prospect theory (Kahneman &amp; Tversky, 1979). He was awarded the 2002 \u003ci>\n  \u003cb>Nobel Prize in Economics\u003c/b>\n\u003c/i> for his work in Prospect theory. Currently, he is professor emeritus of psychology at Princeton University's Department of Psychology.\u003cbr />\u003cbr />\u003ca target=\"_blank\" rel=\"noopener nofollow\" href=\"http://us.macmillan.com/author/danielkahneman\">http://us.macmillan.com/author/daniel...\u003c/a>",

        "Book:kca://book/amzn1.gr.book.v1.aqJnwnCXHPC4HdqN5M_tQA": {
          "__typename": "Book",

          "viewerShelving": null,
          "title": "Thinking, Fast and Slow",
          "titleComplete": "Thinking, Fast and Slow",
          "description": "In the highly anticipated \u003ci>Thinking, Fast and Slow\u003c/i>, Kahneman takes us on a groundbreaking tour of the mind and explains the two systems that drive the way we think. System 1 is fast, intuitive, and emotional; System 2 is slower, more deliberative, and more logical. Kahneman exposes the extraordinary capabilities—and also the faults and biases—of fast thinking, and reveals the pervasive influence of intuitive impressions on our thoughts and behavior. The impact of loss aversion and overconfidence on corporate strategies, the difficulties of predicting what will make us happy in the future, the challenges of properly framing risks at work and at home, the profound effect of cognitive biases on everything from playing the stock market to planning the next vacation—each of these can be understood only by knowing how the two systems work together to shape our judgments and decisions.\u003cbr />\u003cbr />Engaging the reader in a lively conversation about how we think, Kahneman reveals where we can and cannot trust our intuitions and how we can tap into the benefits of slow thinking. He offers practical and enlightening insights into how choices are made in both our business and our personal lives—and how we can use different techniques to guard against the mental glitches that often get us into trouble. \u003ci>Thinking, Fast and Slow\u003c/i> will transform the way you think about thinking.",
          "description({\"stripped\":true})": "In the highly anticipated Thinking, Fast and Slow, Kahneman takes us on a groundbreaking tour of the mind and explains the two systems that drive the way we think. System 1 is fast, intuitive, and emotional; System 2 is slower, more deliberative, and more logical. Kahneman exposes the extraordinary capabilities—and also the faults and biases—of fast thinking, and reveals the pervasive influence of intuitive impressions on our thoughts and behavior. The impact of loss aversion and overconfidence on corporate strategies, the difficulties of predicting what will make us happy in the future, the challenges of properly framing risks at work and at home, the profound effect of cognitive biases on everything from playing the stock market to planning the next vacation—each of these can be understood only by knowing how the two systems work together to shape our judgments and decisions.Engaging the reader in a lively conversation about how we think, Kahneman reveals where we can and cannot trust our intuitions and how we can tap into the benefits of slow thinking. He offers practical and enlightening insights into how choices are made in both our business and our personal lives—and how we can use different techniques to guard against the mental glitches that often get us into trouble. Thinking, Fast and Slow will transform the way you think about thinking.",
