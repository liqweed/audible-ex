          "name": "George Orwell",
          "description": "\u003cb>Eric Arthur Blair\u003c/b> was an English novelist, poet, essayist, journalist and critic who wrote under the pen name of George Orwell. His work is characterised by lucid prose, social criticism, opposition to all totalitarianism (both fascism and stalinism), and support of democratic socialism.\u003cbr />\u003cbr />Orwell is best known for his allegorical novella \u003ci>\n  \u003cb>Animal Farm\u003c/b>\n\u003c/i> (1945) and the dystopian novel \u003ci>\n  \u003cb>Nineteen Eighty-Four\u003c/b>\n\u003c/i> (1949), although his works also encompass literary criticism, poetry, fiction and polemical journalism. His non-fiction works, including \u003ci>\n  \u003cb>The Road to Wigan Pier\u003c/b>\n\u003c/i> (1937), documenting his experience of working-class life in the industrial north of England, and \u003ci>\n  \u003cb>Homage to Catalonia\u003c/b>\n\u003c/i> (1938), an account of his experiences soldiering for the Republican faction of the Spanish Civil War (1936–1939), are as critically respected as his essays on politics, literature, language and culture.\u003cbr />\u003cbr />Orwell's work remains influential in popular culture and in political culture, and the adjective \"Orwellian\"—describing totalitarian and authoritarian social practices—is part of the English language, like many of his neologisms, such as \"Big Brother\", \"Thought Police\", \"Room 101\", \"Newspeak\", \"memory hole\", \"doublethink\", and \"thoughtcrime\". In 2008, The Times named Orwell the second-greatest British writer since 1945.",
