          "name": "Stieg Larsson",
          "description": "\u003cb>Stieg Larsson\u003c/b> (born as \u003cb>Karl Stig-Erland Larsson\u003c/b>) was a Swedish journalist and writer who passed away in 2004.\u003cbr />\u003cbr />As a journalist and editor of the magazine \u003ci>\n  \u003ca href=\"http://expo.se/\" rel=\"nofollow noopener\">Expo\u003c/a>\n\u003c/i>, Larsson was active in documenting and exposing Swedish extreme right and racist organisations. When he died at the age of 50, Larsson left three unpublished thrillers and unfinished manuscripts for more. The first three books (\u003ci>\n  \u003ca href=\"http://www.goodreads.com/book/show/2429135.The_Girl_With_the_Dragon_Tattoo\" rel=\"nofollow noopener\">The Girl With the Dragon Tattoo\u003c/a>\n\u003c/i>, \u003ci>\n  \u003ca href=\"http://www.goodreads.com/book/show/5060378-the-girl-who-played-with-fire\" rel=\"nofollow noopener\">The Girl Who Played With Fire\u003c/a>\n\u003c/i> and \u003ci>\n  \u003ca href=\"http://www.goodreads.com/book/show/6892870-the-girl-who-kicked-the-hornet-s-nest\" rel=\"nofollow noopener\">The Girl Who Kicked the Hornets' Nest\u003c/a>\n\u003c/i>) have since been printed as the \u003ci>\n  \u003ca href=\"http://www.goodreads.com/series/44598-millennium\" rel=\"nofollow noopener\">Millenium\u003c/a>\n\u003c/i> series. These books are all bestsellers in Sweden and in several other countries, including the United States and Canada.\u003cbr />\u003cbr />Witnessed a rape when he was 15, and was helpless to stop it. This event haunted him for the rest of his life. The girl being raped was named Lisbeth, which he later used as the name of the heroine on his Millenium trilogy. Sexual violence against women is also a recurring theme in his work.\u003cbr />\u003cbr />Personal quote:\u003cbr />To exact revenge for yourself or your friends is not only a right, it's an absolute duty.",
