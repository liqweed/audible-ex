          "title": "The Martian",
          "titleComplete": "The Martian",
          "description": "Six days ago, astronaut Mark Watney became one of the first people to walk on Mars. \u003cbr />\u003cbr />Now, he’s sure he’ll be the first person to die there.\u003cbr />\u003cbr />After a dust storm nearly kills him and forces his crew to evacuate while thinking him dead, Mark finds himself stranded and completely alone with no way to even signal Earth that he’s alive—and even if he could get word out, his supplies would be gone long before a rescue could arrive. \u003cbr />\u003cbr />Chances are, though, he won’t have time to starve to death. The damaged machinery, unforgiving environment, or plain-old “human error” are much more likely to kill him first. \u003cbr />\u003cbr />But Mark isn’t ready to give up yet. Drawing on his ingenuity, his engineering skills — and a relentless, dogged refusal to quit — he steadfastly confronts one seemingly insurmountable obstacle after the next. Will his resourcefulness be enough to overcome the impossible odds against him?\u003cbr />\u003cbr />",
