          "name": "Brandon Sanderson",
          "description": "I’m Brandon Sanderson, and I write stories of the fantastic: fantasy, science fiction, and thrillers.\u003cbr />\u003cbr />The release of Wind and Truth in December 2024—the fifth and final book in the first arc of the #1 New York Times bestselling Stormlight Archive series—marks a significant milestone for me. This series is my love letter to the epic fantasy genre, and it’s the type of story I always dreamed epic fantasy could be. Now is a great time to get into the Stormlight Archive since the first arc, which begins with Way of Kings, is complete.\u003cbr />\u003cbr />During our crowdfunding campaign for the leatherbound edition of Words of Radiance, I announced a fifth Secret Project called Isles of the Emberdark, which came out in the summer of 2025. Coming December 2025 is Tailored Realities, my non-Cosmere short story collection featuring the new novella Moment Zero.\u003cbr />\u003cbr />Defiant, the fourth and final volume of the series that started with Skyward in 2018, came out in November 2023, capping an already book-filled year that saw the releases of all four Secret Projects: Tress of the Emerald Sea, The Frugal Wizard’s Handbook for Surviving Medieval England, Yumi and the Nightmare Painter, and The Sunlit Man. These four books were all initially offered to backers of the #1 Kickstarter campaign of all time.\u003cbr />\u003cbr />November 2022 saw the release of The Lost Metal, the seventh volume in the Mistborn saga, and the final volume of the Mistborn Era Two featuring Wax &amp; Wayne. Now that the first arc of the Stormlight Archive is wrapped up, I’ve started writing the third era of Mistborn in 2025.\u003cbr />\u003cbr />Most readers have noticed that my adult fantasy novels are in a connected universe called the Cosmere. This includes The Stormlight Archive, both Mistborn series, Elantris, Warbreaker, four of the five Secret Projects, and various novellas, including The Emperor’s Soul, which won a Hugo Award in 2013. In November 2016 all of the existing Cosmere short fiction was released in one volume called Arcanum Unbounded. If you’ve read all of my adult fantasy novels and want to see some behind-the-scenes information, that collection is a must-read.\u003cbr />\u003cbr />I also have three YA series: The Rithmatist (currently at one book), The Reckoners (a trilogy beginning with Steelheart), and Skyward. For young readers I also have my humorous series Alcatraz vs. the Evil Librarians, which had its final book, Bastille vs. the Evil Librarians, released in 2022. Many of my adult readers enjoy all of those books as well, and many of my YA readers enjoy my adult books, usually starting with Mistborn.\u003cbr />\u003cbr />Additionally, I have a few other novellas that are more on the thriller/sci-fi side. These include the three stories in Legion: The Many Lives of Stephen Leeds, as well as Perfect State and Snapshot. These two novellas are also featured in 2025’s Tailored Realities. There’s a lot of material to go around!\u003cbr />\u003cbr />Good starting places are Mistborn (a.k.a. The Final Empire), Skyward, Steelheart, The Emperor’s Soul, Tress of the Emerald Sea, and Alcatraz vs. the Evil Librarians. If you’re already a fan of big fat fantasies, you can jump right into The Way of Kings.\u003cbr />\u003cbr />I was also honored to be able to complete the final three volumes of The Wheel of Time, beginning with The Gathering Storm, using Robert Jordan’s notes.\u003cbr />\u003cbr />Sample chapters from all of my books are available at brandonsanderson.com—and check out the rest of my site for chapter-by-chapter annotations, deleted scenes, and more.",

          "titleComplete": "The Way of Kings (The Stormlight Archive, #1)",
          "description": "\u003cb>From #1 \u003ci>New York Times\u003c/i> bestselling author Brandon Sanderson, \u003ci>The Way of Kings\u003c/i>, book one of The Stormlight Archive begins an incredible new saga of epic proportion.\u003c/b>\u003cbr />\u003cbr />Roshar is a world of stone and storms. Uncanny tempests of incredible power sweep across the rocky terrain so frequently that they have shaped ecology and civilization alike. Animals hide in shells, trees pull in branches, and grass retracts into the soilless ground. Cities are built only where the topography offers shelter.\u003cbr />\u003cbr />It has been centuries since the fall of the ten consecrated orders known as the Knights Radiant, but their Shardblades and Shardplate remain: mystical swords and suits of armor that transform ordinary men into near-invincible warriors. Men trade kingdoms for Shardblades. Wars were fought for them, and won by them.\u003cbr />\u003cbr />One such war rages on a ruined landscape called the Shattered Plains. There, Kaladin, who traded his medical apprenticeship for a spear to protect his little brother, has been reduced to slavery. In a war that makes no sense, where ten armies fight separately against a single foe, he struggles to save his men and to fathom the leaders who consider them expendable.\u003cbr />\u003cbr />Brightlord Dalinar Kholin commands one of those other armies. Like his brother, the late king, he is fascinated by an ancient text called The Way of Kings. Troubled by over-powering visions of ancient times and the Knights Radiant, he has begun to doubt his own sanity.\u003cbr />\u003cbr />Across the ocean, an untried young woman named Shallan seeks to train under an eminent scholar and notorious heretic, Dalinar's niece, Jasnah. Though she genuinely loves learning, Shallan's motives are less than pure. As she plans a daring theft, her research for Jasnah hints at secrets of the Knights Radiant and the true cause of the war.\u003cbr />\u003cbr />The result of over ten years of planning, writing, and world-building, The Way of Kings is but the opening movement of the Stormlight Archive, a bold masterpiece in the making.\u003cbr />\u003cbr />\u003ci>Speak again the ancient oaths:\u003cbr />\u003cbr />Life before death.\u003cbr />Strength before weakness.\u003cbr />Journey before Destination.\u003cbr />\u003cbr />and return to men the Shards they once bore.\u003cbr />\u003cbr />The Knights Radiant must stand again.\u003c/i>",
